meta:
  profile: academic-paper
  theme: academic
  source: replicated
  layout: horizontal
  routing: orthogonal
  font:
    primary: Times New Roman
    cjk: "Times New Roman,SimSun"
    formula: Times New Roman
  replication:
    colorMode: theme-first
    background: "#FFFFFF"
    palette:
      - hex: "#FFFFFF"
        role: canvas and node fill
        appliesTo: nodes
        confidence: high
      - hex: "#1E1E1E"
        role: "strokes, text, and arrows"
        appliesTo: mixed
        confidence: high
    confidenceNotes:
      - "Source sketches are black on white. Notation was normalized to UML academic conventions: dashed lifelines, filled synchronous arrows, open return arrows, hollow generalization triangles, and compartmented classes."
  figureType: workflow
  title: Approval and purchase-order split
  description: "Manager decision on a waiting requisition, then purchase-order creation when the decision approves it."
  legend: "Filled arrow: synchronous message. Open dashed arrow: return. Vertical dashed line: lifeline."
  canvas: 1880x840
  print:
    widthPt: 1320
    minPt: 8
