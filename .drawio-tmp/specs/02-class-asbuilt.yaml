meta:
  profile: academic-paper
  theme: academic
  source: replicated
  layout: horizontal
  routing: orthogonal
  font:
    primary: Times New Roman
    cjk: "Times New Roman,SimSun"
    formula: Times New Roman
  replication:
    colorMode: theme-first
    background: "#FFFFFF"
    palette:
      - hex: "#FFFFFF"
        role: canvas and node fill
        appliesTo: nodes
        confidence: high
      - hex: "#1E1E1E"
        role: "strokes, text, and arrows"
        appliesTo: mixed
        confidence: high
    confidenceNotes:
      - "Source sketches are black on white. Notation was normalized to UML academic conventions: dashed lifelines, filled synchronous arrows, open return arrows, hollow generalization triangles, and compartmented classes."
  figureType: architecture
  title: As-built class structure
  description: "Classes and relationships for users, requisitions, purchase orders, deliveries, and invoices. ApprovalPolicy is shown as a subclass of User, matching the source sketch."
  legend: "Hollow triangle: generalization. Open arrow: navigable association. Plain line: association."
  canvas: 1240x1240
