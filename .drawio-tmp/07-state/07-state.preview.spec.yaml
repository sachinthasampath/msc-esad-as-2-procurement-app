meta:
  profile: academic-paper
  theme: academic
  source: replicated
  layout: horizontal
  routing: orthogonal
  font:
    primary: Times New Roman
    cjk: Times New Roman,SimSun
    formula: Times New Roman
  replication:
    colorMode: theme-first
    background: '#FFFFFF'
    palette:
      - hex: '#FFFFFF'
        role: canvas and node fill
        appliesTo: nodes
        confidence: high
      - hex: '#1E1E1E'
        role: strokes, text, and arrows
        appliesTo: mixed
        confidence: high
    confidenceNotes:
      - >-
        Source sketches are black on white. Notation was normalized to UML academic conventions: dashed lifelines,
        filled synchronous arrows, open return arrows, hollow generalization triangles, and compartmented classes.
  figureType: workflow
  title: Requisition and purchase-order states
  description: >-
    Requisition states from draft through approval, and purchase-order states from placed through delivery. Dashed
    arrows are the edit and approve transitions drawn dashed in the source.
  legend: 'Open arrow: state transition. Dashed open arrow: edit and approve transitions from the source sketch.'
  canvas: 1040x660
